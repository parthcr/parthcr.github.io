<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>|| चामुंडा कृपा ||</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F1EC;
    --paper:#FFFFFF;
    --ink:#15171A;
    --ink-soft:#5B5E66;
    --ink-faint:#9A9DA3;
    --line:#E4E2DA;

    --blue:#3355FF;
    --blue-ink:#0A1550;
    --green:#0FA968;
    --green-ink:#06341F;
    --violet:#7A4DFF;
    --violet-ink:#241154;
    --amber:#FF9E2C;
    --amber-ink:#4A2900;
    --red:#FF4D4D;
    --red-ink:#4A0A0A;
  }
  *{box-sizing:border-box;}
  *{transition:background-color .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease, transform .12s ease;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    padding:0 0 60px;
  }
  .page{max-width:1200px;margin:0 auto;padding:26px 22px 40px;}

  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;flex-wrap:wrap;gap:8px;}
  h1{font-family:'Sora',sans-serif;font-size:24px;font-weight:800;margin:0;letter-spacing:-0.5px;}
  .updated{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-faint);background:var(--paper);border:1px solid var(--line);padding:4px 9px;border-radius:999px;}

  .sub{color:var(--ink-soft);font-size:13.5px;margin:2px 0 24px;}

  /* two-column 50/50 layout with a bold divider */
  .layout{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:start;}
  .layout-left{position:sticky;top:20px;padding-right:26px;border-right:3px solid var(--ink);}
  .layout-right{padding-left:26px;margin-top:-6px;}
  @media (max-width:880px){
    .layout{grid-template-columns:1fr;}
    .layout-left{position:static;padding-right:0;border-right:none;padding-bottom:20px;border-bottom:3px solid var(--ink);margin-bottom:20px;}
    .layout-right{padding-left:0;}
  }

  /* compact 2x2 stat grid — one unified panel, colored dot markers instead of solid fills */
  .summary{
    display:grid;grid-template-columns:1fr 1fr;
    background:var(--paper);border:2px solid var(--ink);border-radius:18px;
    overflow:hidden;margin-bottom:16px;box-shadow:5px 5px 0 var(--ink);
  }
  .stat{padding:16px 18px;border-right:2px solid var(--line);border-bottom:2px solid var(--line);position:relative;}
  .stat:nth-child(2n){border-right:none;}
  .stat:nth-child(3),.stat:nth-child(4){border-bottom:none;}
  .stat:hover{background:var(--bg);}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;position:relative;top:-1px;}
  .stat.c-blue .dot{background:var(--blue);}
  .stat.c-green .dot{background:var(--green);}
  .stat.c-red .dot{background:var(--red);}
  .stat.c-violet .dot{background:var(--violet);}
  .stat.c-amber .dot{background:var(--amber);}
  .stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft);margin-bottom:7px;font-weight:700;display:flex;align-items:center;}
  .stat-value{font-family:'Sora',sans-serif;font-size:19px;font-weight:800;line-height:1.15;color:var(--ink);}
  .stat-sub{font-size:11.5px;margin-top:3px;font-family:'Space Mono',monospace;}
  .up{color:var(--green);}
  .down{color:var(--red);}

  .btn-add{
    background:var(--ink);color:#fff;border:none;
    padding:13px 18px;font-size:14px;font-weight:700;border-radius:12px;cursor:pointer;
    width:100%;font-family:'Sora',sans-serif;
  }
  .btn-add:hover{background:var(--blue);}
  .btn-add:active{transform:scale(0.98);}

  .section-title{font-family:'Sora',sans-serif;font-size:12px;font-weight:700;color:var(--ink-soft);margin:0 0 8px;text-transform:uppercase;letter-spacing:0.5px;}

  /* holdings — 2 columns within the right half */
  .cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:520px){.cards-grid{grid-template-columns:1fr;}}
  .coin-card{background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:14px;cursor:pointer;position:relative;box-shadow:4px 4px 0 var(--ink);}
  .coin-card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--blue);border-color:var(--blue);}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .card-id{display:flex;align-items:center;gap:8px;min-width:0;}
  .coin-icon{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:var(--bg);box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--ink);}
  .coin-names{min-width:0;}
  .coin-name{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Sora',sans-serif;}
  .coin-tags{display:flex;gap:6px;align-items:center;margin-top:2px;}
  .coin-sym{color:var(--ink-soft);font-size:11px;font-family:'Space Mono',monospace;}
  .coin-wallet{font-size:9.5px;color:var(--ink-soft);border:1px solid var(--line);border-radius:5px;padding:1px 5px;}
  .pct-pill{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;font-family:'Space Mono',monospace;flex-shrink:0;}
  .pct-pill.up{background:var(--green);color:#fff;}
  .pct-pill.down{background:var(--red);color:#fff;}
  .card-remove{position:absolute;top:10px;right:10px;background:transparent;border:none;color:var(--ink-faint);font-size:18px;cursor:pointer;padding:2px 6px;line-height:1;opacity:0;}
  .coin-card:hover .card-remove{opacity:1;}
  .card-remove:hover{color:var(--red);}
  .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding-top:10px;border-top:2px dashed var(--line);}
  .cell-label{font-size:9.5px;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-faint);margin-bottom:2px;font-weight:700;}
  .cell-value{font-family:'Space Mono',monospace;font-size:12.5px;}
  .cell-value.big{font-size:13.5px;font-weight:700;}

  .empty, .loading{color:var(--ink-soft);font-size:13.5px;padding:36px 20px;text-align:center;background:var(--paper);border:2px dashed var(--line);border-radius:16px;}

  /* Add/Edit modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(21,23,26,0.55);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:60;overflow-y:auto;}
  .modal-box{background:var(--paper);border:2px solid var(--ink);border-radius:18px;width:100%;max-width:420px;padding:22px;position:relative;animation:modalIn .18s ease;box-shadow:6px 6px 0 var(--ink);}
  @keyframes modalIn{from{opacity:0;transform:scale(0.97) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .modal-close{position:absolute;top:14px;right:14px;background:var(--bg);border:2px solid var(--ink);width:28px;height:28px;border-radius:50%;color:var(--ink);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .modal-close:hover{background:var(--red);color:#fff;border-color:var(--red);}
  .modal-title{font-family:'Sora',sans-serif;font-size:18px;font-weight:800;margin:0 0 16px;}
  .field{margin-bottom:12px;position:relative;}
  .field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:700;}
  .field input{width:100%;background:var(--bg);border:2px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:13.5px;font-family:'Manrope',sans-serif;}
  .field input:focus{outline:none;border-color:var(--blue);}
  .field input.mono{font-family:'Space Mono',monospace;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .search-results{position:absolute;top:100%;left:0;right:0;background:var(--paper);border:2px solid var(--ink);border-radius:12px;margin-top:5px;max-height:220px;overflow-y:auto;z-index:10;box-shadow:4px 4px 0 var(--ink);}
  .search-results .opt{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;font-size:12.5px;}
  .search-results .opt:hover{background:var(--bg);}
  .search-results img{width:19px;height:19px;border-radius:50%;}
  .search-results .full{color:var(--ink-faint);font-size:11px;margin-left:3px;}
  .selected-coin{display:flex;align-items:center;gap:9px;background:var(--bg);border:2px solid var(--ink);border-radius:10px;padding:9px 12px;margin-bottom:12px;}
  .selected-coin img{width:22px;height:22px;border-radius:50%;}
  .selected-coin .name{font-size:12.5px;font-weight:700;}
  .selected-coin .change{margin-left:auto;font-family:'Space Mono',monospace;font-size:11px;color:var(--blue);cursor:pointer;font-weight:700;}
  .toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12.5px;color:var(--ink-soft);}
  .err{color:var(--red);font-size:12px;margin-top:2px;margin-bottom:10px;display:none;font-weight:600;}
  .btn-primary{background:var(--blue);color:#fff;border:none;padding:11px 18px;font-size:14px;font-weight:700;border-radius:10px;cursor:pointer;width:100%;font-family:'Sora',sans-serif;}
  .btn-primary:hover{background:var(--violet);}
  .btn-primary:disabled{opacity:0.5;cursor:default;}

  /* Chart modal */
  .modal-box.chart-box{max-width:640px;}
  .modal-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .modal-header img{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);}
  .mh-name{font-family:'Sora',sans-serif;font-weight:800;font-size:17px;}
  .mh-sym{color:var(--ink-faint);font-family:'Space Mono',monospace;font-size:12px;}
  .range-row{display:flex;gap:7px;margin-bottom:14px;}
  .range-btn{background:var(--bg);border:2px solid var(--line);color:var(--ink-soft);padding:6px 13px;font-size:11.5px;font-weight:700;border-radius:8px;cursor:pointer;}
  .range-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .chart-wrap{position:relative;height:240px;overflow:visible;}
  #price-chart{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none;}
  .chart-tooltip{
    position:absolute;top:0;pointer-events:none;opacity:0;
    background:var(--ink);color:#fff;border-radius:9px;padding:7px 11px;
    transform:translate(-50%,-115%);white-space:nowrap;z-index:5;
    box-shadow:3px 3px 0 rgba(0,0,0,0.15);
  }
  .tt-value{font-family:'Sora',sans-serif;font-weight:800;font-size:13px;}
  .tt-date{font-family:'Space Mono',monospace;font-size:10.5px;opacity:0.75;margin-top:1px;}
  .modal-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:12.5px;text-align:center;padding:20px;}

  @keyframes flashUp{0%{background:#DFFAEC;}100%{background:transparent;}}
  @keyframes flashDown{0%{background:#FFE3E3;}100%{background:transparent;}}
  .flash-up{animation:flashUp 1s ease;}
  .flash-down{animation:flashDown 1s ease;}

  .allocation-panel{
    background:var(--paper);border:2px solid var(--ink);border-radius:16px;
    padding:14px 16px;margin-top:14px;box-shadow:4px 4px 0 var(--ink);
  }
  .alloc-row{display:flex;align-items:center;gap:14px;}
  #donut-chart{flex-shrink:0;}
  .alloc-legend{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;}
  .alloc-item{display:flex;align-items:center;gap:7px;font-size:12px;}
  .alloc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .alloc-name{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .alloc-pct{margin-left:auto;font-family:'Space Mono',monospace;color:var(--ink-soft);flex-shrink:0;}

  .backup-row{display:flex;gap:8px;margin-top:12px;}
  .btn-ghost{
    flex:1;background:var(--paper);border:2px solid var(--line);color:var(--ink-soft);
    padding:9px 10px;font-size:12px;font-weight:700;border-radius:10px;cursor:pointer;font-family:'Sora',sans-serif;
  }
  .btn-ghost:hover{border-color:var(--ink);color:var(--ink);}

  .card-pct-badge{
    font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-faint);
    margin-top:2px;
  }

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--ink-faint);border-radius:4px;}
</style>
</head>
<body>

<div class="page">
  <header>
    <h1>|| चामुंडा कृपा ||</h1>
    <div class="updated" id="updated-at"></div>
  </header>
  <div class="sub">Alt coins & memecoins, all in one place — live prices via CoinGecko / DexScreener.</div>

  <div class="layout">
    <div class="layout-left">
      <div class="summary">
        <div class="stat c-blue">
          <div class="stat-label"><span class="dot"></span>Total value</div>
          <div class="stat-value" id="sum-value" style="color:var(--green);">$0.00</div>
          <svg id="sparkline" viewBox="0 0 200 40" style="width:100%;height:28px;margin-top:6px;display:none;" preserveAspectRatio="none"></svg>
        </div>
        <div class="stat c-green" id="pl-card">
          <div class="stat-label"><span class="dot"></span>Total P/L</div>
          <div class="stat-value" id="sum-pl">$0.00</div>
          <div class="stat-sub" id="sum-pl-pct">0.00%</div>
        </div>
        <div class="stat c-violet">
          <div class="stat-label"><span class="dot"></span>Invested</div>
          <div class="stat-value" id="sum-cost">$0.00</div>
        </div>
        <div class="stat c-amber">
          <div class="stat-label"><span class="dot"></span>Holdings</div>
          <div class="stat-value" id="sum-count">0</div>
        </div>
      </div>
      <button class="btn-add" id="open-add-modal">+ Add asset</button>

      <div class="allocation-panel" id="allocation-panel" style="display:none;">
        <div class="section-title" style="margin-bottom:12px;">Allocation</div>
        <div class="alloc-row">
          <svg id="donut-chart" viewBox="0 0 120 120" width="110" height="110"></svg>
          <div class="alloc-legend" id="alloc-legend"></div>
        </div>
      </div>

      <div class="backup-row">
        <button class="btn-ghost" id="export-btn">Export backup</button>
        <button class="btn-ghost" id="import-btn">Import backup</button>
        <input type="file" id="import-file" accept="application/json" style="display:none;">
      </div>
    </div>

    <div class="layout-right">
      <div class="section-title">Your holdings</div>
      <div class="cards-grid" id="holdings-grid"></div>
      <div class="empty" id="empty-state" style="display:none;">No assets yet — tap "+ Add asset" to start tracking.</div>
      <div class="loading" id="loading-state" style="display:none;">Loading your portfolio…</div>
    </div>
  </div>
</div>

<!-- Add/Edit modal -->
<div class="modal-overlay" id="add-modal" style="display:none;">
  <div class="modal-box">
    <button class="modal-close" id="add-modal-close">×</button>
    <div class="modal-title" id="modal-title">Add an asset</div>

    <div class="field" id="search-field">
      <label>Search token</label>
      <input type="text" id="coin-search" class="mono" placeholder="e.g. bitcoin, pepe, sol" autocomplete="off">
      <div class="search-results" id="search-results" style="display:none;"></div>
    </div>

    <div class="selected-coin" id="selected-coin-box" style="display:none;"></div>

    <div class="toggle-row">
      <input type="checkbox" id="meme-toggle">
      <label for="meme-toggle" style="margin:0;text-transform:none;font-size:12.5px;color:var(--text-dim);">This is a meme coin — enter buy price as market cap instead</label>
    </div>

    <div class="form-row">
      <div class="field">
        <label>Amount</label>
        <input type="number" step="any" id="amount" class="mono" placeholder="0.00">
      </div>
      <div class="field">
        <label id="buyprice-label">Avg buy price ($)</label>
        <input type="number" step="any" id="buyprice" class="mono" placeholder="0.05">
      </div>
    </div>
    <div class="field">
      <label>Wallet / notes (optional)</label>
      <input type="text" id="wallet" placeholder="e.g. Phantom, Main">
    </div>
    <div class="err" id="form-err"></div>
    <button class="btn-primary" id="add-btn">Add</button>
  </div>
</div>

<!-- Chart modal -->
<div class="modal-overlay" id="chart-modal" style="display:none;">
  <div class="modal-box chart-box">
    <button class="modal-close" id="chart-modal-close">×</button>
    <div class="modal-header" id="modal-header"></div>
    <div class="range-row" id="modal-range">
      <button data-days="30" class="range-btn active">30D</button>
      <button data-days="90" class="range-btn">90D</button>
      <button data-days="365" class="range-btn">1Y</button>
    </div>
    <div class="chart-wrap" id="chart-wrap">
      <div class="modal-loading" id="modal-loading">Loading chart…</div>
      <svg id="price-chart" viewBox="0 0 700 300" preserveAspectRatio="none"></svg>
      <div class="chart-tooltip" id="chart-tooltip">
        <div class="tt-value" id="tt-value"></div>
        <div class="tt-date" id="tt-date"></div>
      </div>
    </div>
  </div>
</div>

<script>
try{

const API = 'https://api.coingecko.com/api/v3';
const STORAGE_KEY = 'my-assets-holdings-v1';
const hasCloudStorage = typeof window.storage !== 'undefined';

let holdings = [];
let priceCache = {};
let selectedCoin = null;
let editingIdx = null;
let searchTimer = null;
let chartModalOpen = false;
let currentChartIdx = null;
let currentChartDays = 30;
let chartCache = {};

function fmt(n, d){
  d = d === undefined ? 2 : d;
  if(n === null || n === undefined || isNaN(n)) return '—';
  return n.toLocaleString(undefined, {minimumFractionDigits:d, maximumFractionDigits:d});
}

// ---------- storage ----------
async function loadHoldings(){
  document.getElementById('loading-state').style.display = 'block';
  try{
    if(hasCloudStorage){
      const res = await window.storage.get('holdings', false);
      holdings = res && res.value ? JSON.parse(res.value) : [];
    }else{
      const raw = localStorage.getItem(STORAGE_KEY);
      holdings = raw ? JSON.parse(raw) : [];
    }
  }catch(e){ holdings = []; }
  document.getElementById('loading-state').style.display = 'none';
  if(holdings.length) await refreshPrices();
  render();
}
async function saveHoldings(){
  try{
    if(hasCloudStorage){
      await window.storage.set('holdings', JSON.stringify(holdings), false);
    }else{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(holdings));
    }
  }catch(e){
    console.error('save failed', e);
  }
}

// ---------- backup / restore ----------
document.getElementById('export-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({holdings, exportedAt: new Date().toISOString()}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'assets-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-file').click();
});
document.getElementById('import-file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const parsed = JSON.parse(ev.target.result);
      const incoming = Array.isArray(parsed) ? parsed : parsed.holdings;
      if(!Array.isArray(incoming)) throw new Error('Invalid backup file');
      const merge = confirm(`Import ${incoming.length} asset(s)? Click OK to add to your current holdings, or Cancel to replace them entirely.`);
      holdings = merge ? [...holdings, ...incoming] : incoming;
      await saveHoldings();
      await refreshPrices();
      render();
    }catch(err){
      alert("Couldn't read that backup file — make sure it's one exported from this page.");
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

// ---------- per-API request pacing ----------
const lanes = {
  price: {last:0, gap:1300},
  chart: {last:0, gap:450},
  dex: {last:0, gap:350},
  geckoterminal: {last:0, gap:500}
};
function laneFor(url){
  if(url.includes('dexscreener')) return 'dex';
  if(url.includes('geckoterminal')) return 'geckoterminal';
  if(url.includes('market_chart')) return 'chart';
  return 'price';
}
async function throttledFetch(url, options, maxRetries){
  options = options || {};
  maxRetries = maxRetries === undefined ? 3 : maxRetries;
  const lane = lanes[laneFor(url)];
  const wait = Math.max(0, lane.last + lane.gap - Date.now());
  if(wait > 0) await new Promise(r => setTimeout(r, wait));
  lane.last = Date.now();

  for(let attempt = 0; attempt <= maxRetries; attempt++){
    try{
      const res = await fetch(url, options);
      if(res.status === 429 && attempt < maxRetries){
        await new Promise(r => setTimeout(r, 1400 * Math.pow(2, attempt)));
        lane.last = Date.now();
        continue;
      }
      return res;
    }catch(e){
      if(attempt === maxRetries) throw e;
      await new Promise(r => setTimeout(r, 900 * (attempt+1)));
      lane.last = Date.now();
    }
  }
}

// ---------- DexScreener fallback (for coins CoinGecko doesn't price) ----------
async function fetchDexScreenerPrice(symbol){
  try{
    const res = await throttledFetch(`https://api.dexscreener.com/latest/dex/search?q=${encodeURIComponent(symbol)}`, {cache:'no-store'}, 3);
    if(!res.ok) return null;
    const data = await res.json();
    const pairs = data.pairs || [];
    if(!pairs.length) return null;
    const exact = pairs.filter(p => p.baseToken && p.baseToken.symbol && p.baseToken.symbol.toLowerCase() === symbol.toLowerCase());
    const pool = exact.length ? exact : pairs;
    const match = pool.sort((a,b) => (b.liquidity?.usd||0) - (a.liquidity?.usd||0))[0];
    if(!match || !match.priceUsd) return null;
    return {
      usd: parseFloat(match.priceUsd),
      usd_24h_change: match.priceChange?.h24 ?? null,
      image: match.info?.imageUrl || null,
      marketCap: match.fdv || match.marketCap || null,
      source: 'dexscreener',
      pairAddress: match.pairAddress || null,
      chainId: match.chainId || null
    };
  }catch(e){ return null; }
}

const GT_CHAIN_MAP = {ethereum:'eth', bsc:'bsc', polygon:'polygon_pos', arbitrum:'arbitrum', optimism:'optimism', base:'base', solana:'solana', avalanche:'avax', fantom:'ftm', cronos:'cro'};
async function fetchGeckoTerminalHistory(chainId, pairAddress, days){
  const network = GT_CHAIN_MAP[chainId] || chainId;
  const limit = Math.min(days, 365);
  try{
    const url = `https://api.geckoterminal.com/api/v2/networks/${network}/pools/${pairAddress}/ohlcv/day?aggregate=1&limit=${limit}&_=${Date.now()}`;
    const res = await throttledFetch(url, {cache:'no-store'}, 3);
    if(!res.ok) return null;
    const data = await res.json();
    const list = data?.data?.attributes?.ohlcv_list || [];
    if(!list.length) return null;
    return list.map(row => [row[0]*1000, row[4]]).sort((a,b)=>a[0]-b[0]);
  }catch(e){ return null; }
}

async function fetchSupply(id){
  for(let i=0;i<2;i++){
    try{
      const res = await throttledFetch(`${API}/coins/markets?vs_currency=usd&ids=${id}`, {cache:'no-store'}, 3);
      const data = await res.json();
      if(data && data[0] && data[0].circulating_supply) return data[0].circulating_supply;
    }catch(e){}
    if(i===0) await new Promise(r=>setTimeout(r,1100));
  }
  return null;
}

// ---------- price refresh ----------
async function refreshPrices(){
  const ids = [...new Set(holdings.map(h => h.id))];
  if(!ids.length) return;
  try{
    const res = await throttledFetch(`${API}/coins/markets?vs_currency=usd&ids=${ids.join(',')}`, {cache:'no-store'}, 3);
    if(res.ok){
      const data = await res.json();
      const found = new Set();
      data.forEach(c => {
        priceCache[c.id] = {usd:c.current_price, usd_24h_change:c.price_change_percentage_24h, image:c.image, marketCap:c.market_cap, source:'coingecko'};
        found.add(c.id);
      });
      const missing = ids.filter(id => !found.has(id));
      for(const id of missing){
        const h = holdings.find(h => h.id === id);
        if(!h) continue;
        const fb = await fetchDexScreenerPrice(h.symbol);
        if(fb) priceCache[id] = fb;
      }
    }
  }catch(e){ console.error('price refresh failed', e); }
  document.getElementById('updated-at').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

// ---------- render ----------
function render(){
  const grid = document.getElementById('holdings-grid');
  const empty = document.getElementById('empty-state');
  grid.innerHTML = '';

  if(!holdings.length){
    empty.style.display = 'block';
  }else{
    empty.style.display = 'none';
  }

  window._lastPrices = window._lastPrices || {};

  // pass 1 — compute every holding's value first, so we know the portfolio
  // total before rendering each card's "% of portfolio"
  const computed = holdings.map((h, idx) => {
    const p = priceCache[h.id];
    const price = p ? p.usd : null;
    const value = price !== null ? price * h.amount : null;
    const cost = h.buyPrice * h.amount;
    const pl = value !== null ? value - cost : null;
    const plPct = cost > 0 && pl !== null ? (pl/cost)*100 : null;
    return {h, idx, p, price, value, cost, pl, plPct};
  });
  const totalValue = computed.reduce((s,c) => s + (c.value||0), 0);
  const totalCost = computed.reduce((s,c) => s + c.cost, 0);

  computed.forEach(({h, idx, p, price, value, cost, pl, plPct}) => {
    // flash the value cell when price actually moved since the last render
    const prevPrice = window._lastPrices[h.id];
    const priceFlash = (price !== null && prevPrice !== undefined && price !== prevPrice) ? (price > prevPrice ? 'flash-up' : 'flash-down') : '';
    if(price !== null) window._lastPrices[h.id] = price;

    const dayChange = p ? p.usd_24h_change : null;
    const dayCls = dayChange === null ? '' : (dayChange >= 0 ? 'up' : 'down');
    const daySign = dayChange !== null && dayChange >= 0 ? '+' : '';

    const card = document.createElement('div');
    card.className = 'coin-card';
    card.innerHTML = `
      <button class="card-remove" data-idx="${idx}">×</button>
      <div class="card-top">
        <div class="card-id">
          ${p && p.image ? `<img src="${p.image}" class="coin-icon" alt="">` : '<span class="coin-icon"></span>'}
          <div class="coin-names">
            <div class="coin-name">${h.name}</div>
            <div class="coin-tags"><span class="coin-sym">${h.symbol.toUpperCase()}</span>${h.wallet ? `<span class="coin-wallet">${h.wallet}</span>` : ''}</div>
          </div>
        </div>
        ${dayChange !== null ? `<span class="pct-pill ${dayCls}">${daySign}${fmt(dayChange,2)}%</span>` : ''}
      </div>
      <div class="card-grid">
        <div><div class="cell-label">Amount</div><div class="cell-value">${fmt(h.amount,4)}</div></div>
        <div><div class="cell-label">Avg buy</div><div class="cell-value">$${fmt(h.buyPrice, h.buyPrice < 0.01 ? 6 : 2)}</div></div>
        <div><div class="cell-label">Price now</div><div class="cell-value">${price !== null ? '$'+fmt(price, price<0.01?6:2) : '—'}</div></div>
        <div><div class="cell-label">Value</div><div class="cell-value big ${priceFlash}" style="color:var(--green);">${value !== null ? '$'+fmt(value,2) : '—'}</div></div>
        <div style="grid-column:1/-1;"><div class="cell-label">P/L</div><div class="cell-value big ${pl>=0?'up':'down'}">${pl !== null ? (pl>=0?'+':'')+'$'+fmt(pl,2)+' ('+(plPct>=0?'+':'')+fmt(plPct,2)+'%)' : '—'}</div></div>
      </div>
    `;
    card.addEventListener('click', (e) => {
      if(e.target.closest('.card-remove')) return;
      openChart(idx);
    });
    grid.appendChild(card);
  });

  document.querySelectorAll('.card-remove').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const idx = parseInt(e.currentTarget.dataset.idx);
      holdings.splice(idx, 1);
      await saveHoldings();
      render();
    });
  });

  document.getElementById('sum-value').textContent = '$' + fmt(totalValue,2);
  document.getElementById('sum-cost').textContent = '$' + fmt(totalCost,2);
  document.getElementById('sum-count').textContent = holdings.length;
  const totalPl = totalValue - totalCost;
  const plEl = document.getElementById('sum-pl');
  const plPctEl = document.getElementById('sum-pl-pct');
  const plCard = document.getElementById('pl-card');
  plEl.textContent = (totalPl>=0?'+':'') + '$' + fmt(Math.abs(totalPl),2);
  const totalPlPct = totalCost>0 ? (totalPl/totalCost)*100 : 0;
  plPctEl.textContent = (totalPl>=0?'+':'') + fmt(totalPlPct,2) + '%';
  plCard.className = 'stat ' + (totalPl>=0 ? 'c-green' : 'c-red');

  drawAllocation(computed, totalValue);
  recordValueSnapshot(totalValue);
}

// ---------- value history (for the Total Value sparkline) ----------
const VALUE_HISTORY_KEY = 'value-history-v1';
let valueHistory = [];

async function loadValueHistory(){
  try{
    if(hasCloudStorage){
      const res = await window.storage.get('value-history', false);
      valueHistory = res && res.value ? JSON.parse(res.value) : [];
    }else{
      const raw = localStorage.getItem(VALUE_HISTORY_KEY);
      valueHistory = raw ? JSON.parse(raw) : [];
    }
  }catch(e){ valueHistory = []; }
}
async function saveValueHistory(){
  try{
    if(hasCloudStorage){
      await window.storage.set('value-history', JSON.stringify(valueHistory), false);
    }else{
      localStorage.setItem(VALUE_HISTORY_KEY, JSON.stringify(valueHistory));
    }
  }catch(e){}
}

function recordValueSnapshot(totalValue){
  if(totalValue <= 0) return;
  const now = Date.now();
  const last = valueHistory[valueHistory.length - 1];
  // only log a new point every ~10 minutes so the history builds up over
  // real time (hours/days) instead of filling with noise every refresh
  if(!last || now - last[0] >= 10 * 60 * 1000){
    valueHistory.push([now, totalValue]);
    if(valueHistory.length > 500) valueHistory = valueHistory.slice(-500);
    saveValueHistory();
  }
  drawSparkline();
}

function drawSparkline(){
  const svg = document.getElementById('sparkline');
  if(valueHistory.length < 2){ svg.style.display = 'none'; return; }
  svg.style.display = 'block';
  svg.innerHTML = '';
  const W=200, H=40;
  const vals = valueHistory.map(p => p[1]);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const range = (maxV - minV) || 1;
  const xFor = i => (i/(vals.length-1)) * W;
  const yFor = v => H - 3 - ((v-minV)/range) * (H-6);
  const isUp = vals[vals.length-1] >= vals[0];
  const color = isUp ? '#0FA968' : '#FF4D4D';

  let d = '';
  vals.forEach((v,i) => { const x=xFor(i), y=yFor(v); d += (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1)+' '; });
  const ns = 'http://www.w3.org/2000/svg';
  const line = document.createElementNS(ns,'path');
  line.setAttribute('d', d); line.setAttribute('fill','none'); line.setAttribute('stroke', color);
  line.setAttribute('stroke-width','2'); line.setAttribute('stroke-linecap','round'); line.setAttribute('stroke-linejoin','round');
  svg.appendChild(line);
}

// ---------- allocation donut chart ----------
const ALLOC_COLORS = ['#3355FF','#0FA968','#7A4DFF','#FF9E2C','#FF4D4D','#00B8D9','#D946EF','#84CC16'];
function drawAllocation(computed, totalValue){
  const panel = document.getElementById('allocation-panel');
  const svg = document.getElementById('donut-chart');
  const legend = document.getElementById('alloc-legend');

  const withValue = computed.filter(c => c.value !== null && c.value > 0);
  if(!withValue.length || totalValue <= 0){
    panel.style.display = 'none';
    return;
  }
  panel.style.display = 'block';

  const sorted = [...withValue].sort((a,b) => b.value - a.value);
  const top = sorted.slice(0, 7);
  const restValue = sorted.slice(7).reduce((s,c) => s + c.value, 0);
  const slices = top.map((c,i) => ({name: c.h.symbol.toUpperCase(), value: c.value, color: ALLOC_COLORS[i % ALLOC_COLORS.length]}));
  if(restValue > 0) slices.push({name: 'Other', value: restValue, color: '#9A9DA3'});

  const ns = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  const cx=60, cy=60, r=48, strokeW=18;
  const circumference = 2 * Math.PI * r;
  let offset = 0;

  slices.forEach(s => {
    const frac = s.value / totalValue;
    const dash = frac * circumference;
    const circle = document.createElementNS(ns,'circle');
    circle.setAttribute('cx', cx); circle.setAttribute('cy', cy); circle.setAttribute('r', r);
    circle.setAttribute('fill','none'); circle.setAttribute('stroke', s.color);
    circle.setAttribute('stroke-width', strokeW);
    circle.setAttribute('stroke-dasharray', `${dash} ${circumference - dash}`);
    circle.setAttribute('stroke-dashoffset', -offset);
    circle.setAttribute('transform', `rotate(-90 ${cx} ${cy})`);
    circle.style.transition = 'stroke-dasharray 0.6s ease';
    svg.appendChild(circle);
    offset += dash;
  });

  legend.innerHTML = slices.map(s => {
    const pct = (s.value/totalValue)*100;
    return `<div class="alloc-item"><span class="alloc-dot" style="background:${s.color};"></span><span class="alloc-name">${s.name}</span><span class="alloc-pct">${fmt(pct,1)}%</span></div>`;
  }).join('');
}

async function openChart(idx){

async function prefetchOtherRanges(idx, loaded){
  const h = holdings[idx];
  if(!h) return;
  for(const d of [30,90,365].filter(d => d !== loaded)){
    if(currentChartIdx !== idx) return;
    const key = `${h.id}_${d}`;
    if(chartCache[key]) continue;
    try{
      const res = await throttledFetch(`${API}/coins/${h.id}/market_chart?vs_currency=usd&days=${d}&_=${Date.now()}`, {cache:'no-store'}, 3);
      if(res.ok){
        const data = await res.json();
        if(data.prices && data.prices.length) chartCache[key] = data.prices;
      }
    }catch(e){}
  }
}

async function fetchAndDrawChart(idx, days, isSilentRetry){
  const h = holdings[idx];
  if(!h) return;
  const loadingEl = document.getElementById('modal-loading');
  const svg = document.getElementById('price-chart');
  const key = `${h.id}_${days}`;
  const cached = !!chartCache[key];
  if(cached){
    loadingEl.style.display = 'none';
  }else{
    svg.style.opacity = '0.35';
    loadingEl.style.display = 'flex';
    loadingEl.textContent = 'Loading chart…';
  }

  let rawPrices;
  if(chartCache[key]){
    rawPrices = chartCache[key];
  }else{
    try{
      const res = await throttledFetch(`${API}/coins/${h.id}/market_chart?vs_currency=usd&days=${days}&_=${Date.now()}`, {cache:'no-store'}, 3);
      if(res.status === 429){
        // one silent extra attempt after a short pause before bothering the
        // person with an error — most transient rate-limit blips clear fast
        if(!isSilentRetry){
          await new Promise(r => setTimeout(r, 2200));
          return fetchAndDrawChart(idx, days, true);
        }
        svg.style.opacity='1'; svg.innerHTML='';
        loadingEl.innerHTML = "Rate-limited — wait a few seconds. <button id='retry-c' class='range-btn' style='margin-top:8px;'>Retry</button>";
        document.getElementById('retry-c').addEventListener('click', () => fetchAndDrawChart(idx, days));
        return;
      }
      if(res.status === 401 || res.status === 403){
        svg.style.opacity='1'; svg.innerHTML='';
        loadingEl.innerHTML = "Range not available on free tier. <button id='retry-30' class='range-btn' style='margin-top:8px;'>Try 30D</button>";
        document.getElementById('retry-30').addEventListener('click', () => {
          document.querySelectorAll('#modal-range .range-btn').forEach(b => b.classList.toggle('active', b.dataset.days==='30'));
          currentChartDays = 30;
          fetchAndDrawChart(idx, 30);
        });
        return;
      }
      rawPrices = res.ok ? (await res.json()).prices || [] : [];
      if(!rawPrices.length){
        const p = priceCache[h.id];
        if(p && p.source === 'dexscreener' && p.pairAddress && p.chainId){
          loadingEl.textContent = 'Loading on-chain chart…';
          const gt = await fetchGeckoTerminalHistory(p.chainId, p.pairAddress, days);
          if(gt && gt.length) rawPrices = gt;
        }
      }
      if(rawPrices.length) chartCache[key] = rawPrices;
    }catch(e){
      if(!isSilentRetry){
        await new Promise(r => setTimeout(r, 1500));
        return fetchAndDrawChart(idx, days, true);
      }
      svg.style.opacity='1'; svg.innerHTML='';
      loadingEl.innerHTML = "Couldn't load chart. <button id='retry-c2' class='range-btn' style='margin-top:8px;'>Retry</button>";
      document.getElementById('retry-c2').addEventListener('click', () => fetchAndDrawChart(idx, days));
      return;
    }
  }

  if(!rawPrices.length){
    svg.style.opacity='1'; svg.innerHTML='';
    loadingEl.textContent = 'No historical data yet — common for very new or thin-liquidity coins.';
    return;
  }
  loadingEl.style.display = 'none';
  const valuePoints = rawPrices.map(p => [p[0], p[1]*h.amount]);
  drawChart(valuePoints);
}

function drawChart(points){
  const svg = document.getElementById('price-chart');
  svg.innerHTML = '';
  svg.style.opacity = '1';
  if(!points.length) return;

  const W=700, H=300, padTop=30, padBottom=32;
  const values = points.map(p=>p[1]);
  const minV = Math.min(...values), maxV = Math.max(...values);
  const range = (maxV-minV) || 1;
  const xFor = i => (i/(points.length-1))*W;
  const yFor = v => {
    const y = padTop + (1-(v-minV)/range)*(H-padTop-padBottom);
    return Math.max(2, Math.min(H-2, y));
  };

  let d = '';
  // build a smooth curve through the points (Catmull-Rom -> cubic Bezier)
  // instead of jagged straight-line segments between each point
  const coords = points.map((p,i) => [xFor(i), yFor(p[1])]);
  if(coords.length < 3){
    coords.forEach((c,i) => { d += (i===0?'M':'L')+c[0].toFixed(2)+','+c[1].toFixed(2)+' '; });
  }else{
    d = `M${coords[0][0].toFixed(2)},${coords[0][1].toFixed(2)} `;
    for(let i=0; i<coords.length-1; i++){
      const p0 = coords[i-1] || coords[i];
      const p1 = coords[i];
      const p2 = coords[i+1];
      const p3 = coords[i+2] || p2;
      const c1x = p1[0] + (p2[0]-p0[0])/6;
      const c1y = p1[1] + (p2[1]-p0[1])/6;
      const c2x = p2[0] - (p3[0]-p1[0])/6;
      const c2y = p2[1] - (p3[1]-p1[1])/6;
      d += `C${c1x.toFixed(2)},${c1y.toFixed(2)} ${c2x.toFixed(2)},${c2y.toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)} `;
    }
  }
  const isUp = values[values.length-1] >= values[0];
  const color = isUp ? '#0FA968' : '#FF4D4D';
  const areaD = d + `L${W},${H} L0,${H} Z`;
  const ns = 'http://www.w3.org/2000/svg';

  const defs = document.createElementNS(ns,'defs');
  defs.innerHTML = `<linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.28"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient>`;
  svg.appendChild(defs);

  for(let i=0;i<=4;i++){
    const v = minV + (range*i/4);
    const y = yFor(v);
    const gl = document.createElementNS(ns,'line');
    gl.setAttribute('x1',0); gl.setAttribute('x2',W); gl.setAttribute('y1',y); gl.setAttribute('y2',y);
    gl.setAttribute('stroke','#E4E2DA'); gl.setAttribute('stroke-width','1'); gl.setAttribute('stroke-dasharray','3,4');
    svg.appendChild(gl);
    const lbl = document.createElementNS(ns,'text');
    lbl.setAttribute('x',4); lbl.setAttribute('y',Math.max(12,y-4));
    lbl.setAttribute('fill','#5B5E66'); lbl.setAttribute('font-size','11'); lbl.setAttribute('font-family','Space Mono, monospace');
    lbl.textContent = '$'+fmt(v, v<1?4:2);
    svg.appendChild(lbl);
  }
  [0, Math.floor((points.length-1)/2), points.length-1].forEach((idx,i,arr) => {
    const pt = points[idx]; if(!pt) return;
    const x = xFor(idx);
    const t = document.createElementNS(ns,'text');
    t.setAttribute('x', i===0?x+2:(i===arr.length-1?x-2:x));
    t.setAttribute('y', H-8);
    t.setAttribute('fill','#5B5E66'); t.setAttribute('font-size','11'); t.setAttribute('font-family','Space Mono, monospace');
    t.setAttribute('text-anchor', i===0?'start':(i===arr.length-1?'end':'middle'));
    t.textContent = new Date(pt[0]).toLocaleDateString(undefined,{month:'short',day:'numeric'});
    svg.appendChild(t);
  });

  const area = document.createElementNS(ns,'path');
  area.setAttribute('d',areaD); area.setAttribute('fill','url(#cg)');
  svg.appendChild(area);
  const line = document.createElementNS(ns,'path');
  line.setAttribute('d',d); line.setAttribute('fill','none'); line.setAttribute('stroke',color);
  line.setAttribute('stroke-width','2.5'); line.setAttribute('stroke-linecap','round'); line.setAttribute('stroke-linejoin','round');
  svg.appendChild(line);

  try{
    if(points.length > 1){
      area.style.opacity = '0';
      const len = line.getTotalLength();
      if(len && isFinite(len)){
        line.style.strokeDasharray = len; line.style.strokeDashoffset = len;
        line.getBoundingClientRect();
        line.style.transition = 'stroke-dashoffset 0.9s cubic-bezier(0.22, 1, 0.36, 1)';
        area.style.transition = 'opacity 0.6s ease 0.3s';
        requestAnimationFrame(() => { line.style.strokeDashoffset='0'; area.style.opacity='1'; });
      }else{ area.style.opacity='1'; }
    }
  }catch(e){ area.style.opacity='1'; }

  // crosshair — a vertical guide line + dot that follows the cursor/touch
  const crosshairLine = document.createElementNS(ns,'line');
  crosshairLine.setAttribute('y1', padTop); crosshairLine.setAttribute('y2', H-padBottom);
  crosshairLine.setAttribute('stroke', '#15171A'); crosshairLine.setAttribute('stroke-width','1');
  crosshairLine.setAttribute('opacity','0');
  svg.appendChild(crosshairLine);

  const crosshairDot = document.createElementNS(ns,'circle');
  crosshairDot.setAttribute('r','5'); crosshairDot.setAttribute('fill', color);
  crosshairDot.setAttribute('stroke','#fff'); crosshairDot.setAttribute('stroke-width','2');
  crosshairDot.setAttribute('opacity','0');
  svg.appendChild(crosshairDot);

  setupChartTooltip(svg, points, xFor, yFor, crosshairLine, crosshairDot);
}

function setupChartTooltip(svg, points, xFor, yFor, crosshairLine, crosshairDot){
  const wrap = document.getElementById('chart-wrap');
  const tooltip = document.getElementById('chart-tooltip');
  const ttValue = document.getElementById('tt-value');
  const ttDate = document.getElementById('tt-date');

  function pointFromClientX(clientX){
    const rect = svg.getBoundingClientRect();
    const relX = ((clientX - rect.left) / rect.width) * 700; // svg viewBox width
    const idx = Math.round((relX / 700) * (points.length - 1));
    return Math.max(0, Math.min(points.length - 1, idx));
  }

  function showAt(clientX, clientY){
    const idx = pointFromClientX(clientX);
    const pt = points[idx];
    if(!pt) return;
    const rect = svg.getBoundingClientRect();
    const wrapRect = wrap.getBoundingClientRect();
    const svgX = xFor(idx), svgY = yFor(pt[1]);
    const pxX = (svgX / 700) * rect.width;
    const pxY = (svgY / 300) * rect.height;

    crosshairLine.setAttribute('x1', svgX); crosshairLine.setAttribute('x2', svgX);
    crosshairLine.setAttribute('opacity','1');
    crosshairDot.setAttribute('cx', svgX); crosshairDot.setAttribute('cy', svgY);
    crosshairDot.setAttribute('opacity','1');

    tooltip.style.opacity = '1';
    tooltip.style.left = (rect.left - wrapRect.left + pxX) + 'px';
    tooltip.style.top = (rect.top - wrapRect.top + pxY) + 'px';
    ttValue.textContent = '$' + fmt(pt[1], pt[1] < 1 ? 4 : 2);
    ttDate.textContent = new Date(pt[0]).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
  }

  function hide(){
    tooltip.style.opacity = '0';
    crosshairLine.setAttribute('opacity','0');
    crosshairDot.setAttribute('opacity','0');
  }

  svg.onmousemove = (e) => showAt(e.clientX, e.clientY);
  svg.onmouseleave = hide;
  svg.ontouchstart = (e) => { if(e.touches[0]) showAt(e.touches[0].clientX, e.touches[0].clientY); };
  svg.ontouchmove = (e) => { e.preventDefault(); if(e.touches[0]) showAt(e.touches[0].clientX, e.touches[0].clientY); };
  svg.ontouchend = hide;
}

setInterval(async () => {
  if(holdings.length && !chartModalOpen){
    await refreshPrices();
    render();
  }
}, 20000);

loadValueHistory().then(loadHoldings);

}catch(err){
  document.body.insertAdjacentHTML('beforeend',
    '<div style="max-width:600px;margin:30px auto;padding:14px;background:#FFE5E5;border:2px solid #FF4D4D;border-radius:10px;color:#7A0000;font-family:monospace;font-size:12px;white-space:pre-wrap;">Error: ' + err.message + '</div>');
}
