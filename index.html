<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>|| चामुंडा कृपा ||</title>
<style>
  :root{
    --bg:#f7f7f5;
    --card:#ffffff;
    --line:#e2e2e0;
    --header-bg:#fafafa;
    --text:#1f1f1f;
    --label:#8a8a86;
    --green:#2f6f4f;
    --green-tint:#eaf3ee;
    --red:#b3413a;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:64px 20px 40px;
  }
  h1{
    font-weight:600;
    font-size:22px;
    letter-spacing:-0.01em;
    margin:0 0 40px;
    text-align:center;
  }
  .grid{
    display:grid;
    gap:12px;
    width:100%;
    max-width:420px;
  }
  a.tool-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 18px;
    text-decoration:none;
    color:var(--text);
    transition:background .12s, border-color .12s;
  }
  a.tool-card:hover{
    background:var(--green-tint);
    border-color:var(--green);
  }
  .tool-card .name{
    font-size:14.5px;
    font-weight:600;
  }
  .tool-card .arrow{
    color:var(--label);
    font-size:14px;
    transition:color .12s, transform .12s;
  }
  a.tool-card:hover .arrow{
    color:var(--green);
    transform:translateX(2px);
  }
  footer{
    margin-top:48px;
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--label);
  }
</style>
</head>
<body>
  <h1>|| चामुंडा कृपा ||</h1>
  <div class="grid">
    <a class="tool-card" href="goldchallenge.html">
      <span class="name">Gold Challenge</span>
      <span class="arrow">&rarr;</span>
    </a>
    <a class="tool-card" href="portfolio.html">
      <span class="name">Portfolio</span>
      <span class="arrow">&rarr;</span>
    </a>
    <a class="tool-card" href="portfolio-tracker.html">
      <span class="name">Portfolio Tracker</span>
      <span class="arrow">&rarr;</span>
    </a>
    <a class="tool-card" href="assets-data.html">
      <span class="name">Assets Data</span>
      <span class="arrow">&rarr;</span>
    </a>
    <a class="tool-card" href="ledger.html">
      <span class="name">Ledger</span>
      <span class="arrow">&rarr;</span>
    </a>
  </div>
  <footer>parthcr.github.io</footer>
</body>
</html>
