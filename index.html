<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>|| चामुंडा कृपा ||</title>
<style>
  :root{
    --ink:#0e1420;
    --panel:#161d2b;
    --line:#2a3247;
    --text:#e8ecf4;
    --text-dim:#8b93a7;
    --gold:#d4a94f;
    --gold-soft:#8a7239;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, #1a2236 0%, transparent 60%),
      var(--ink);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:60px 20px;
  }
  h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:28px;
    margin:0 0 48px;
    text-align:center;
  }
  .sub{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--gold-soft);
    text-transform:uppercase;
    margin-bottom:48px;
  }
  .grid{
    display:grid;
    gap:16px;
    width:100%;
    max-width:420px;
  }
  a.tool-card{
    display:block;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
    text-decoration:none;
    color:var(--text);
    transition:border-color .15s, transform .15s;
  }
  a.tool-card:hover{
    border-color:var(--gold-soft);
    transform:translateY(-2px);
  }
  .tool-card .name{
    font-size:16px;
    font-weight:700;
    margin-bottom:4px;
  }
  .tool-card .desc{
    font-size:12.5px;
    color:var(--text-dim);
  }
  footer{
    margin-top:50px;
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-dim);
  }
</style>
</head>
<body>
  <h1>|| चामुंडा कृपा ||</h1>

  <div class="grid">
    <a class="tool-card" href="goldchallenge.html">
      <div class="name">Gold Challenge</div>
    </a>
    <a class="tool-card" href="portfolio.html">
      <div class="name">Portfolio</div>
    </a>
    <a class="tool-card" href="portfolio-tracker.html">
      <div class="name">Portfolio Tracker</div>
    </a>
  </div>

  <footer>parthcr.github.io</footer>
</body>
</html>
