<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>चामुंडा कृपा</title>
<style>
  :root{
    --bg:#f7f7f5;
    --card:#ffffff;
    --border:#e2e2e0;
    --text:#1f1f1f;
    --muted:#8a8a86;
    --accent:#2f6f4f;
    --accent-soft:#eaf3ee;
    --danger:#b3413a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:32px 16px;
  }
  .wrap{
    max-width:820px;
    margin:0 auto;
  }
  h1{
    font-size:22px;
    font-weight:600;
    margin:0 0 20px 0;
    color:var(--accent);
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  table{
    width:100%;
    border-collapse:collapse;
  }
  thead th{
    text-align:left;
    font-size:13px;
    letter-spacing:.02em;
    color:var(--muted);
    font-weight:600;
    padding:12px 14px;
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
    background:#fafafa;
  }
  thead th:last-child{
    border-right:none;
  }
  tbody td{
    padding:0;
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
  }
  tbody tr td:last-child{
    border-right:none;
  }
  tbody tr:last-child td{
    border-bottom:none;
  }
  td input{
    width:100%;
    border:none;
    background:transparent;
    padding:12px 14px;
    font-size:14px;
    color:var(--text);
    outline:none;
  }
  td input:focus{
    background:var(--accent-soft);
  }
  td input::placeholder{
    color:#c9c9c6;
  }
  td.del{
    width:36px;
    text-align:center;
  }
  .del-btn{
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
    padding:4px 8px;
    line-height:1;
  }
  .del-btn:hover{
    color:var(--danger);
  }
  .footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    background:#fafafa;
    flex-wrap:wrap;
    gap:10px;
  }
  .footer-left{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .add-btn{
    border:1px solid var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
    padding:8px 14px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .add-btn:hover{
    filter:brightness(0.97);
  }
  .add-btn.secondary{
    border-color:var(--border);
    background:#fff;
    color:var(--text);
  }
  .hint{
    font-size:12px;
    color:var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>|| चामुंडा कृपा ||</h1>
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Balance</th>
          <th>Amount</th>
          <th>Need to Add</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="footer">
      <div class="footer-left">
        <button class="add-btn" onclick="addRow()">+ Add Row</button>
        <button class="add-btn secondary" onclick="exportData()">Export</button>
        <button class="add-btn secondary" onclick="document.getElementById('fileInput').click()">Import</button>
        <input type="file" id="fileInput" accept=".json" style="display:none" onchange="importData(event)">
      </div>
      <span class="hint">Cells are optional — leave any blank. Auto-saves in this browser.</span>
    </div>
  </div>
</div>

<script>
  const rowsEl = document.getElementById('rows');
  const STORAGE_KEY = 'ledger-table-data';

  function makeRow(values = ['', '', '', '']) {
    const tr = document.createElement('tr');

    values.forEach((val) => {
      const td = document.createElement('td');
      const input = document.createElement('input');
      input.type = 'text';
      input.value = val;
      input.placeholder = '—';
      input.addEventListener('input', saveData);
      td.appendChild(input);
      tr.appendChild(td);
    });

    const delTd = document.createElement('td');
    delTd.className = 'del';
    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.innerHTML = '&times;';
    delBtn.onclick = () => { tr.remove(); saveData(); };
    delTd.appendChild(delBtn);
    tr.appendChild(delTd);

    return tr;
  }

  function addRow(values) {
    rowsEl.appendChild(makeRow(values));
    saveData();
  }

  function getAllData() {
    const rows = [];
    rowsEl.querySelectorAll('tr').forEach((tr) => {
      const inputs = tr.querySelectorAll('input');
      rows.push(Array.from(inputs).map(i => i.value));
    });
    return rows;
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(getAllData()));
  }

  function loadSavedData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      for (let i = 0; i < 5; i++) addRow();
      return;
    }
    try {
      const data = JSON.parse(raw);
      if (Array.isArray(data) && data.length) {
        data.forEach(row => rowsEl.appendChild(makeRow(row)));
      } else {
        for (let i = 0; i < 5; i++) addRow();
      }
    } catch (e) {
      for (let i = 0; i < 5; i++) addRow();
    }
  }

  function exportData() {
    const data = getAllData();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ledger-data.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!Array.isArray(data)) throw new Error('bad format');
        rowsEl.innerHTML = '';
        data.forEach(row => rowsEl.appendChild(makeRow(row)));
        saveData();
      } catch (err) {
        alert('Could not read that file. Make sure it is a Ledger export (.json).');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  loadSavedData();
</script>
</body>
</html>
